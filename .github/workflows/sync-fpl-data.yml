name: Sync FPL data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: sync-fpl-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh complete FPL snapshot
        env:
          FPL_SYNC_TRIGGER: automatic
          FPL_WRITE_DB: 'false'
        run: npm run sync:data:fpl

      - name: Verify generated data
        run: |
          npm run type-check
          npm run lint
          npm run build

      - name: Commit updated FPL data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/competitions/fpl
          if git diff --cached --quiet; then
            echo "FPL data is already current."
            exit 0
          fi
          git commit -m "chore(data): sync latest FPL snapshot"
          git push
